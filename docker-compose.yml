services:
  mongo:
    image: mongo:7
    container_name: pct-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: policy-claims
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build: ./app
    container_name: pct-api
    restart: unless-stopped
    environment:
      PORT: "4000"
      MONGODB_URI: mongodb://root:example@mongo:27017/policy-claims?authSource=admin
      MONGO_DB_NAME: policy-claims
      JWT_SECRET: change-me-in-production
      NODE_ENV: development
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "4000:4000"

  client:
    build: ./client
    container_name: pct-client
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  mongo-data:
