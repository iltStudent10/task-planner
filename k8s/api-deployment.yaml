apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-claims-api
  labels:
    app: policy-claims-api
    component: api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: policy-claims-api
  template:
    metadata:
      labels:
        app: policy-claims-api
        component: api
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: policy-claims-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
            - name: MONGO_URI
              value: "mongodb://root:example@mongo:27017/policy-claims?authSource=admin"
            - name: MONGO_DB_NAME
              value: "policy-claims"
            - name: JWT_SECRET
              value: "change-me-in-production"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 12
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
